<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Noto Sans', 'DejaVu Sans', sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Título -->
  <text x="65" y="62" font-size="32" font-weight="700" fill="#1f2933">Ocupação de Máquinas de Academia: arquitetura da entrega (v2)</text>
  <text x="65" y="94" font-size="18" fill="#52606d">Ponte e API num programa só, no notebook · proposta de 25/11/2026 (a confirmar no grupo) · as setas mostram o caminho do dado</text>

  <!-- Contêiner do notebook -->
  <rect x="445" y="128" width="710" height="640" rx="16" fill="#f7f9fb" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="465" y="156" font-size="16" font-weight="700" fill="#52606d">NOTEBOOK (laboratório ou casa)</text>

  <!-- ===== Linha 1 ===== -->
  <!-- Nó sensor -->
  <rect x="65" y="180" width="270" height="250" rx="14" fill="#fdf1de" stroke="#b26a00" stroke-width="2.5"/>
  <text x="85" y="214" font-size="22" font-weight="700" fill="#1f2933">Nó sensor (N02)</text>
  <text x="85" y="238" font-size="15" fill="#52606d">máquina 2 · ESP32-C6 + HC-SR04</text>
  <text x="85" y="272" font-size="15" fill="#1f2933">• mede a distância do usuário</text>
  <text x="85" y="294" font-size="15" fill="#1f2933">• histerese 70/90 cm</text>
  <text x="85" y="316" font-size="15" fill="#1f2933">• envia ao mudar de estado</text>
  <text x="85" y="338" font-size="15" fill="#1f2933">  e a cada 15 s (sinal de vida)</text>
  <rect x="85" y="372" width="230" height="40" rx="20" fill="#ffffff" stroke="#b26a00" stroke-width="2"/>
  <text x="200" y="397" font-size="14" font-weight="700" fill="#8a5200" text-anchor="middle">FALTA: HC-SR04 real (qui 26/11)</text>

  <!-- Gateway -->
  <rect x="465" y="180" width="270" height="250" rx="14" fill="#fdf1de" stroke="#b26a00" stroke-width="2.5"/>
  <text x="485" y="214" font-size="22" font-weight="700" fill="#1f2933">Gateway (N01)</text>
  <text x="485" y="238" font-size="15" fill="#52606d">máquina 1 · USB do notebook</text>
  <text x="485" y="272" font-size="15" fill="#1f2933">• recebe o sensor por ESP-NOW</text>
  <text x="485" y="294" font-size="15" fill="#1f2933">• mede a máquina 1 (HC-SR04)</text>
  <text x="485" y="316" font-size="15" fill="#1f2933">• imprime todos os quadros na</text>
  <text x="485" y="338" font-size="15" fill="#1f2933">  serial, inclusive os próprios</text>
  <rect x="485" y="372" width="230" height="40" rx="20" fill="#ffffff" stroke="#b26a00" stroke-width="2"/>
  <text x="600" y="397" font-size="14" font-weight="700" fill="#8a5200" text-anchor="middle">FALTA: HC-SR04 real (qui 26/11)</text>

  <!-- Ponte + API -->
  <rect x="865" y="180" width="270" height="250" rx="14" fill="#fdf1de" stroke="#b26a00" stroke-width="2.5"/>
  <text x="885" y="214" font-size="22" font-weight="700" fill="#1f2933">Ponte + API (Python)</text>
  <text x="885" y="238" font-size="15" fill="#52606d">um programa só, em server/</text>
  <text x="885" y="268" font-size="15" fill="#1f2933">• valida o quadro, ignora seq</text>
  <text x="885" y="289" font-size="15" fill="#1f2933">  repetido, offline após 60 s</text>
  <text x="885" y="310" font-size="15" fill="#1f2933">• grava no Mongo</text>
  <text x="885" y="331" font-size="15" fill="#1f2933">• API: GET /machines (memória)</text>
  <text x="885" y="352" font-size="15" fill="#1f2933">  e /history (Mongo)</text>
  <rect x="885" y="372" width="230" height="40" rx="20" fill="#ffffff" stroke="#b26a00" stroke-width="2"/>
  <text x="1000" y="397" font-size="14" font-weight="700" fill="#8a5200" text-anchor="middle">TESTADA; falta o Mongo real</text>

  <!-- MongoDB -->
  <rect x="1265" y="180" width="270" height="250" rx="14" fill="#fdf1de" stroke="#b26a00" stroke-width="2.5"/>
  <text x="1285" y="214" font-size="22" font-weight="700" fill="#1f2933">MongoDB Atlas</text>
  <text x="1285" y="238" font-size="15" fill="#52606d">banco gym_occupancy</text>
  <text x="1285" y="272" font-size="15" fill="#1f2933">• nodes: estado atual,</text>
  <text x="1285" y="294" font-size="15" fill="#1f2933">  last_seen, online</text>
  <text x="1285" y="316" font-size="15" fill="#1f2933">• telemetry: 1 linha por</text>
  <text x="1285" y="338" font-size="15" fill="#1f2933">  mudança de estado</text>
  <rect x="1285" y="372" width="230" height="40" rx="20" fill="#ffffff" stroke="#b26a00" stroke-width="2"/>
  <text x="1400" y="397" font-size="14" font-weight="700" fill="#8a5200" text-anchor="middle">NO AR; formato novo em ajuste</text>

  <!-- Setas da linha 1 -->
  <line x1="338" y1="305" x2="446" y2="305" stroke="#1f2933" stroke-width="3"/>
  <polygon points="462,305 446,297 446,313" fill="#1f2933"/>
  <text x="400" y="278" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">ESP-NOW</text>
  <text x="400" y="296" font-size="13" fill="#52606d" text-anchor="middle">rádio 2,4 GHz</text>
  <text x="400" y="334" font-size="13" fill="#52606d" text-anchor="middle">canal 11</text>

  <line x1="738" y1="305" x2="846" y2="305" stroke="#1f2933" stroke-width="3"/>
  <polygon points="862,305 846,297 846,313" fill="#1f2933"/>
  <text x="800" y="278" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">USB serial</text>
  <text x="800" y="334" font-size="13" fill="#52606d" text-anchor="middle">N02,1,17</text>

  <!-- Ponte <-> Mongo (grava e lê histórico) -->
  <line x1="1154" y1="305" x2="1246" y2="305" stroke="#1f2933" stroke-width="3"/>
  <polygon points="1262,305 1246,297 1246,313" fill="#1f2933"/>
  <polygon points="1138,305 1154,297 1154,313" fill="#1f2933"/>
  <text x="1200" y="270" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">grava e lê</text>
  <text x="1200" y="288" font-size="13" fill="#52606d" text-anchor="middle">o histórico</text>
  <text x="1200" y="334" font-size="13" fill="#52606d" text-anchor="middle">usuário de</text>
  <text x="1200" y="352" font-size="13" fill="#52606d" text-anchor="middle">leitura e escrita</text>

  <!-- ===== Linha 2 ===== -->
  <!-- Página web -->
  <rect x="865" y="560" width="270" height="180" rx="14" fill="#f1f3f5" stroke="#5b6470" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="885" y="594" font-size="22" font-weight="700" fill="#1f2933">Página web</text>
  <text x="885" y="618" font-size="15" fill="#52606d">abre no navegador do notebook</text>
  <text x="885" y="650" font-size="15" fill="#1f2933">• máquinas livres/ocupadas/offline</text>
  <text x="885" y="672" font-size="15" fill="#1f2933">• ordenação e estatística</text>
  <rect x="885" y="690" width="230" height="40" rx="20" fill="#ffffff" stroke="#5b6470" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1000" y="715" font-size="14" font-weight="700" fill="#3e4752" text-anchor="middle">EM DESENVOLVIMENTO</text>

  <!-- Seta Ponte+API -> Página -->
  <line x1="1000" y1="433" x2="1000" y2="544" stroke="#1f2933" stroke-width="3"/>
  <polygon points="1000,558 992,542 1008,542" fill="#1f2933"/>
  <text x="1016" y="486" font-size="14" font-weight="700" fill="#1f2933">HTTP / JSON</text>
  <text x="1016" y="506" font-size="13" fill="#52606d">GET /machines</text>

  <!-- Legenda -->
  <rect x="65" y="540" width="350" height="200" rx="14" fill="#ffffff" stroke="#cbd2d9" stroke-width="2"/>
  <text x="85" y="570" font-size="18" font-weight="700" fill="#1f2933">Legenda</text>
  <rect x="85" y="584" width="26" height="18" rx="4" fill="#e6f4ee" stroke="#1b7f5c" stroke-width="2"/>
  <text x="124" y="599" font-size="15" fill="#1f2933">pronto e testado</text>
  <rect x="85" y="610" width="26" height="18" rx="4" fill="#fdf1de" stroke="#b26a00" stroke-width="2"/>
  <text x="124" y="625" font-size="15" fill="#1f2933">falta testar com hardware/banco</text>
  <rect x="85" y="636" width="26" height="18" rx="4" fill="#f1f3f5" stroke="#5b6470" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="124" y="651" font-size="15" fill="#1f2933">ainda não existe</text>
  <text x="85" y="684" font-size="15" font-weight="700" fill="#1f2933">Quadro: N&lt;id&gt;,&lt;estado&gt;,&lt;seq&gt;</text>
  <text x="85" y="705" font-size="14" fill="#1f2933">1 = ocupada, 0 = livre · seq cresce a cada envio</text>
  <text x="85" y="725" font-size="14" fill="#1f2933">nó: 5 s para ocupar, 90 s para liberar</text>

  <!-- Rodapé -->
  <text x="65" y="808" font-size="17" font-weight="700" fill="#1f2933">Nenhuma placa fala com o banco.</text>
  <text x="65" y="834" font-size="16" fill="#3e4752">Só a ponte grava no Mongo. A chave fica no .env do notebook (fora do git), num usuário do Atlas com leitura e escrita só em nodes e telemetry.</text>
  <text x="65" y="860" font-size="16" fill="#3e4752">O IP do notebook precisa estar liberado no Atlas (Network Access). Escopo da disciplina: 2 nós, servidor e página simples; o resto fica para a bolsa.</text>
</svg>
